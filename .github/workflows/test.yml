name: "Test"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, version-* ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  # GCC 5
  ubuntu-gcc-5:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Build Docker image with GCC + CMake + build-essential
      - name: Build Docker image
        shell: bash
        run: |
          docker build -t gcc5_4-cmake:ci ./test/script/docker/gcc-5.4

      # Run GCC tests
      - name: Run GCC tests
        shell: bash
        run: |
          docker run --rm \
                -v ${{ github.workspace }}:/src \
                -w /src \
                gcc5_4-cmake:ci \
                bash ./test/script/docker/gcc-5.4/test.sh

  # GCC 13
  ubuntu-gcc-13:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run GCC tests
      - name: Run GCC tests
        working-directory: test
        shell: bash
        run: |
          bash ./script/test-gcc.sh 13

  # GCC 14
  ubuntu-gcc-14:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run GCC tests
      - name: Run GCC tests
        working-directory: test
        shell: bash
        run: |
          bash ./script/test-gcc.sh 14

  # GCC 15
  ubuntu-gcc-15:
    if: >-
      github.repository_owner == 'Kim-J-Smith' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    runs-on: ubuntu-26.04

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run GCC tests
      - name: Run GCC tests
        working-directory: test
        shell: bash
        run: |
          bash ./script/test-gcc.sh 15

  # GCC 16
  ubuntu-gcc-16:
    if: >-
      github.repository_owner == 'Kim-J-Smith' &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    runs-on: ubuntu-26.04

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run GCC tests
      - name: Run GCC tests
        working-directory: test
        shell: bash
        run: |
          bash ./script/test-gcc.sh 16

  # Clang 18
  ubuntu-clang-18:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run Clang tests
      - name: Run Clang tests
        working-directory: test
        shell: bash
        run: |
          bash ./script/test-clang.sh 18

  # Clang 19
  ubuntu-clang-19:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: ubuntu-latest

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run Clang tests
      - name: Run Clang tests
        working-directory: test
        shell: bash
        run: |
          bash ./script/test-clang.sh 19

  # VS 2022
  windows-vs-2022:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: windows-2022

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run MSVC tests
      - name: Run MSVC tests
        working-directory: test
        shell: cmd
        run: |
          ./script/test-msvc.bat 14 17 20 23

  # VS 2026
  windows-vs-2026:
    if: github.repository_owner == 'Kim-J-Smith'
    runs-on: windows-2025-vs2026

    steps:
      # Get the code
      - name: Checkout code
        uses: actions/checkout@v6

      # Run MSVC tests
      - name: Run MSVC tests
        working-directory: test
        shell: cmd
        run: |
          ./script/test-msvc.bat 14 17 20 23
